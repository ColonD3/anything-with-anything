<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anything in anything</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#777;--line:#ddd;--red:#e0301e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f2f2f2;--mute:#999;--line:#333}}
:root[data-theme="dark"]{--bg:#121212;--ink:#f2f2f2;--mute:#999;--line:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,system-ui,"Helvetica Neue",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(34px,7vw,58px);line-height:.95;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}
p.sub{color:var(--mute);margin:0 0 28px;max-width:60ch}
.step{border-top:2px solid var(--ink);padding-top:14px;margin-top:28px}
.step h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 12px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.row button{font:inherit;font-weight:600;border:2px solid var(--line);background:none;color:var(--ink);padding:9px 14px;cursor:pointer;border-radius:0;flex:1;min-width:100px}
.row button[aria-pressed=true]{border-color:var(--red);color:var(--red);background:color-mix(in srgb, var(--red) 8%, transparent)}
.desc{color:var(--mute);font-size:13px;margin:8px 0 0}
label{display:block;font-weight:600;margin:14px 0 4px}
textarea,input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);padding:10px;resize:vertical}
textarea{min-height:64px}
textarea:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.file{display:block;border:2px dashed var(--line);padding:16px;text-align:center;color:var(--mute);cursor:pointer;margin-top:6px;font-weight:600}
.file input{display:none}
button.go{font:inherit;font-weight:600;border:2px solid var(--red);background:var(--red);color:#fff;padding:13px 14px;cursor:pointer;width:100%;margin-top:14px;border-radius:0}
button.go:disabled{opacity:.4;cursor:default}
button.secondary{font:inherit;font-weight:600;border:2px solid var(--line);background:none;color:var(--mute);padding:9px 12px;cursor:pointer;margin-top:8px;width:100%;border-radius:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;margin-top:12px}
.pill{color:var(--mute);font-size:13px;margin-top:6px}
.xray{font-size:13px;color:var(--mute);margin-top:10px;word-break:break-word}
.xray b{color:var(--red)}
.panel{display:none}
.panel.active{display:block}
canvas{width:100%;image-rendering:pixelated;border:1px solid var(--line);display:block}
audio{width:100%;margin-top:8px;display:block}
#found_out img,#found_out canvas,.result-block canvas{max-width:100%}
.result-block{margin-top:10px}
#found_text,.found-text{font-size:19px;font-weight:700;color:var(--red);word-break:break-word}
.msg{color:var(--red);font-size:13px;min-height:1.3em;margin-top:6px}
.status{font-weight:600;margin:14px 0 2px}
.bar{height:8px;background:var(--line);margin:8px 0;position:relative}
.bar div{height:100%;background:var(--red);width:0%;transition:width .1s linear}
.tones{font:12px/1.4 ui-monospace,monospace;color:var(--mute);min-height:1.3em}
.or{color:var(--mute);font-size:13px;text-align:center;margin:14px 0}
select{font:inherit;border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:8px;width:100%}
</style></head>
<body><main>
<h1>Anything in anything</h1>
<p class="sub">Pick what you want to hide, then pick where it hides. Every combination works the same way in reverse to reveal it.</p>

<div class="step">
<h2>1. What to hide</h2>
<div class="row" role="group" aria-label="What to hide">
<button data-pt="text" aria-pressed="true">Text</button>
<button data-pt="pic" aria-pressed="false">Picture</button>
<button data-pt="aud" aria-pressed="false">Audio clip</button>
</div>
<div class="panel active" data-pp="text">
<label for="ppSecret">Message</label>
<textarea id="ppSecret">meet me at the lake at midnight</textarea>
</div>
<div class="panel" data-pp="pic">
<label class="file" tabindex="0" id="ppPicLabel">Choose a picture<input id="ppPicFile" type="file" accept="image/*"></label>
<label>Resolution (longest side) <span id="ppResV" style="font-weight:400;color:var(--mute)"></span></label>
<input type="range" id="ppRes" min="8" max="255" value="32">
<label>Compression <span id="ppQualV" style="font-weight:400;color:var(--mute)"></span></label>
<input type="range" id="ppQual" min="5" max="95" value="65">
<canvas id="ppPreview" style="max-width:200px;margin-top:6px;display:none"></canvas>
</div>
<div class="panel" data-pp="aud">
<label class="file" tabindex="0" id="ppAudLabel">Choose an audio file<input id="ppAudFile" type="file" accept="audio/*"></label>
<label>Clip length <span id="ppDurV" style="font-weight:400;color:var(--mute)"></span></label>
<input type="range" id="ppDur" min="1" max="8" value="3" step="0.5">
<label>Bitrate (lower = smaller, worse quality) <span id="ppBrV" style="font-weight:400;color:var(--mute)"></span></label>
<input type="range" id="ppBr" min="6" max="48" value="16">
<audio id="ppAudPreview" controls style="display:none"></audio>
<div class="pill" id="ppAudSize"></div>
</div>
</div>

<div class="step">
<h2>2. Where to hide it</h2>
<div class="row" role="group" aria-label="Carrier">
<button data-c="text" aria-pressed="true">Text</button>
<button data-c="pic" aria-pressed="false">Picture</button>
<button data-c="snd" aria-pressed="false">Sound</button>
</div>
<div class="desc" id="carrierDesc"></div>

<div class="panel active" data-carrier="text">
<label>Method</label>
<div class="row" role="group" aria-label="Text method">
<button data-tm="tag" aria-pressed="true">Invisible chars</button>
<button data-tm="zw" aria-pressed="false">Zero-width bits</button>
<button data-tm="hg" aria-pressed="false">Lookalike letters</button>
</div>
<div class="desc" id="textModeDesc"></div>
<label for="tCover">What people see</label>
<textarea id="tCover">lol ok</textarea>
<label class="chk"><input type="checkbox" id="tLock"> Lock with a password</label>
<input type="password" id="tPw" placeholder="Password" style="display:none;margin-top:8px">
<button class="go" id="tGo">Copy text with secret</button>
<div class="msg" id="tMsg"></div>
<div class="xray" id="tXray"></div>
</div>

<div class="panel" data-carrier="pic">
<label>Cover picture (looks unchanged to the eye)</label>
<label class="file" tabindex="0" id="picCoverLabel">Choose a cover picture<input id="picCover" type="file" accept="image/*"></label>
<canvas id="stegoCanvas" style="display:none;margin-top:8px"></canvas>
<label class="chk"><input type="checkbox" id="pLock"> Lock with a password</label>
<input type="password" id="pPw" placeholder="Password" style="display:none;margin-top:8px">
<button class="go" id="pGo">Save picture with secret</button>
<div class="msg" id="pMsg"></div>
<div class="xray" id="pXray"></div>
</div>

<div class="panel" data-carrier="snd">
<label class="chk"><input type="checkbox" id="sLock"> Lock with a password</label>
<input type="password" id="sPw" placeholder="Password" style="display:none;margin-top:8px">
<div class="pill" id="sEst"></div>
<button class="go" id="sGo">Generate sound</button>
<audio id="sPreviewAudio" controls style="display:none"></audio>
<button class="secondary" id="sDownload" style="display:none">Download this sound</button>
<div class="msg" id="sMsg"></div>
</div>
</div>

<div class="step">
<h2>3. Reveal</h2>
<div class="desc">Uses whichever carrier is selected above.</div>

<div class="panel active" data-reveal="text">
<label for="tProbe">Paste any text</label>
<textarea id="tProbe" placeholder="Paste a message here"></textarea>
<button class="secondary" id="tClear">Clear</button>
<input type="password" id="tPw2" placeholder="Password (if it's locked)" style="display:none;margin-top:8px">
<div id="found_text" class="result-block"></div>
<div class="msg" id="tMsg2"></div>
</div>

<div class="panel" data-reveal="pic">
<label class="file" tabindex="0" id="picProbeLabel">Drop a stego picture<input id="picProbe" type="file" accept="image/*"></label>
<input type="password" id="pPw2" placeholder="Password (if it's locked)" style="display:none;margin-top:8px">
<div id="found_pic" class="result-block"></div>
<div class="msg" id="pMsg2"></div>
</div>

<div class="panel" data-reveal="snd">
<label class="file" tabindex="0" id="sFileLabel">Upload a recording<input id="sFileProbe" type="file" accept="audio/*"></label>
<div class="or">— or —</div>
<button class="secondary" id="sListen">Listen live with the microphone</button>
<button class="secondary" id="sStop" style="display:none">Stop listening</button>
<div class="status" id="sStatus"></div>
<div class="bar"><div id="sBar"></div></div>
<div class="pill" id="sBytes"></div>
<div class="tones" id="sTones"></div>
<input type="password" id="sPw2" placeholder="Password (if it's locked)" style="display:none;margin-top:8px">
<div id="found_snd" class="result-block"></div>
<div class="msg" id="sMsg2"></div>
</div>
</div>

</main>
<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),td=new TextDecoder('utf-8',{fatal:true});
let dl=null;window.claude&&claude.use('downloads').then(d=>{dl=d});

// ================= shared: password lock =================
async function keyFrom(pw){const h=await crypto.subtle.digest('SHA-256',enc.encode('anyink:'+pw));return crypto.subtle.importKey('raw',h,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function lockBytes(bytes,pw){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pw),bytes));const o=new Uint8Array(1+12+ct.length);o[0]=1;o.set(iv,1);o.set(ct,13);return o}
async function unlockBytes(bytes,pw){if(bytes[0]!==1)return bytes;const iv=bytes.slice(1,13),ct=bytes.slice(13);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},await keyFrom(pw),ct))}

// ================= shared: typed payload build/render =================
const TYPE_TEXT=0, TYPE_IMG_RAW=73, TYPE_IMG_JPEG=74, TYPE_AUDIO=65;
function textPayloadBytes(str){const body=enc.encode(str);const out=new Uint8Array(body.length+1);out[0]=TYPE_TEXT;out.set(body,1);return out}
function canvasToBlobP(c,type,q){return new Promise(res=>c.toBlob(res,type,q))}
function blobToImage(blob){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob)})}
function downsampleArea(img,W,H){
 const full=document.createElement('canvas');let fw=img.naturalWidth||img.width,fh=img.naturalHeight||img.height;
 while(fw>W*2){fw=Math.max(W,Math.round(fw/2));fh=Math.max(H,Math.round(fh/2))}
 full.width=fw;full.height=fh;const fx=full.getContext('2d');fx.imageSmoothingEnabled=true;fx.drawImage(img,0,0,fw,fh);
 const sd=fx.getImageData(0,0,fw,fh).data,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),out=x.createImageData(W,H);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){
  const x0=Math.floor(i/W*fw),x1=Math.max(x0+1,Math.floor((i+1)/W*fw)),y0=Math.floor(j/H*fh),y1=Math.max(y0+1,Math.floor((j+1)/H*fh));
  let r=0,g=0,b=0,n=0;for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){const o=(yy*fw+xx)*4;r+=sd[o];g+=sd[o+1];b+=sd[o+2];n++}
  const o=(j*W+i)*4;out.data[o]=r/n;out.data[o+1]=g/n;out.data[o+2]=b/n;out.data[o+3]=255}
 x.putImageData(out,0,0);return[out,c]}
function computeDims(img,long){const W0=img.naturalWidth||img.width,H0=img.naturalHeight||img.height;
 let W,H;if(W0>=H0){W=long;H=Math.max(4,Math.round(long*H0/W0))}else{H=long;W=Math.max(4,Math.round(long*W0/H0))}
 return[Math.min(255,W),Math.min(255,H)]}

// ---- the ONE shared "what to hide" panel ----
const pp={kind:'text',img:null,audBuf:null,onChange:()=>{}};
document.querySelectorAll('.row[aria-label="What to hide"] button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.row[aria-label="What to hide"] button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
 pp.kind=b.dataset.pt;
 document.querySelectorAll('[data-pp]').forEach(p=>p.classList.toggle('active',p.dataset.pp===pp.kind));
 pp.onChange();
});
$('ppSecret').addEventListener('input',()=>pp.onChange());
$('ppPicLabel').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('ppPicFile').click()};
$('ppPicFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{pp.img=im;$('ppPicLabel').firstChild.textContent='Picture: '+f.name;drawPicPreview();pp.onChange()};im.src=URL.createObjectURL(f)};
$('ppRes').addEventListener('input',()=>{drawPicPreview();pp.onChange()});
$('ppQual').addEventListener('input',()=>{drawPicPreview();pp.onChange()});
let picToken=0;
async function buildPicBytes(){
 if(!pp.img)return null;
 const long=+$('ppRes').value,[W,H]=computeDims(pp.img,long);
 const[id,c]=downsampleArea(pp.img,W,H);
 const rawLen=W*H*3+3;
 const qual=(+$('ppQual').value)/100;
 const blob=await canvasToBlobP(c,'image/jpeg',Math.max(0.05,qual));
 const jbuf=new Uint8Array(await blob.arrayBuffer());
 if(jbuf.length+1>=rawLen){const d=id.data,px=new Uint8Array(rawLen);px[0]=TYPE_IMG_RAW;px[1]=W;px[2]=H;for(let i=0;i<W*H;i++){px[3+i*3]=d[i*4];px[4+i*3]=d[i*4+1];px[5+i*3]=d[i*4+2]}return{bytes:px,W,H,kind:'raw'}}
 const px=new Uint8Array(jbuf.length+1);px[0]=TYPE_IMG_JPEG;px.set(jbuf,1);
 return{bytes:px,W,H,kind:'jpeg',blob};
}
async function drawPicPreview(){
 if(!pp.img)return;const my=++picToken;
 const r=await buildPicBytes();if(!r||my!==picToken)return;
 const cv=$('ppPreview');cv.width=r.W*6;cv.height=r.H*6;cv.style.display='block';const cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
 if(r.kind==='jpeg'){const im=await blobToImage(r.blob);if(my!==picToken)return;cx.drawImage(im,0,0,cv.width,cv.height)}
 else{const[id2]=downsampleArea(pp.img,r.W,r.H);const small=document.createElement('canvas');small.width=r.W;small.height=r.H;small.getContext('2d').putImageData(id2,0,0);cx.drawImage(small,0,0,cv.width,cv.height)}
 $('ppResV').textContent=r.W+'×'+r.H+' px';
 $('ppQualV').textContent=r.bytes.length+' bytes'+(r.kind==='raw'?' (raw — smaller than JPEG here)':' at '+$('ppQual').value+'% quality');
}
$('ppAudLabel').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('ppAudFile').click()};
$('ppAudFile').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 $('ppAudLabel').firstChild.textContent='Reading '+f.name+'…';
 try{
  const actx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await actx.decodeAudioData(await f.arrayBuffer());
  pp.audBuf=buf;$('ppAudLabel').firstChild.textContent='Audio: '+f.name+' ('+buf.duration.toFixed(1)+'s available)';
  $('ppDur').max=Math.min(8,buf.duration).toFixed(1);
  buildAudPreview();
 }catch{$('ppAudLabel').firstChild.textContent='Could not read that audio file.';pp.audBuf=null}
 pp.onChange();
};
$('ppDur').addEventListener('input',()=>{$('ppDurV').textContent=$('ppDur').value+'s';buildAudPreview();pp.onChange()});
$('ppBr').addEventListener('input',()=>{$('ppBrV').textContent=$('ppBr').value+' kbps';buildAudPreview();pp.onChange()});
$('ppDurV').textContent=$('ppDur').value+'s';$('ppBrV').textContent=$('ppBr').value+' kbps';
let audToken=0;
async function buildAudBytes(){
 if(!pp.audBuf)return null;
 const dur=Math.min(+$('ppDur').value,pp.audBuf.duration);
 const sr=16000,nSamples=Math.round(dur*sr);
 const octx=new OfflineAudioContext(1,nSamples,sr);
 const src=octx.createBufferSource();src.buffer=pp.audBuf;src.connect(octx.destination);src.start(0);
 const rendered=await octx.startRendering();
 const rtCtx=new (window.AudioContext||window.webkitAudioContext)();
 const streamNode=rtCtx.createMediaStreamDestination();
 const playSrc=rtCtx.createBufferSource();playSrc.buffer=rendered;playSrc.connect(streamNode);
 const kbps=+$('ppBr').value*1000;
 const mimeCandidates=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
 let mime=mimeCandidates.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
 const rec=new MediaRecorder(streamNode.stream,mime?{mimeType:mime,audioBitsPerSecond:kbps}:{audioBitsPerSecond:kbps});
 const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 const done=new Promise(res=>rec.onstop=res);
 rec.start();playSrc.start();
 await new Promise(r=>setTimeout(r,dur*1000+150));
 rec.stop();await done;rtCtx.close();
 const blob=new Blob(chunks,{type:mime||'audio/webm'});
 const buf=new Uint8Array(await blob.arrayBuffer());
 const px=new Uint8Array(buf.length+1);px[0]=TYPE_AUDIO;px.set(buf,1);
 return{bytes:px,blob};
}
async function buildAudPreview(){
 if(!pp.audBuf)return;const my=++audToken;
 const r=await buildAudBytes();if(!r||my!==audToken)return;
 const a=$('ppAudPreview');a.src=URL.createObjectURL(r.blob);a.style.display='block';
 $('ppAudSize').textContent=r.bytes.length+' bytes';
}
async function buildPayload(){
 if(pp.kind==='text')return textPayloadBytes($('ppSecret').value);
 if(pp.kind==='pic'){const r=await buildPicBytes();return r?r.bytes:textPayloadBytes('')}
 if(pp.kind==='aud'){const r=await buildAudBytes();return r?r.bytes:textPayloadBytes('')}
}

// ---- decode any typed payload into DOM ----
async function renderPayload(bytes,outEl,msgEl){
 outEl.innerHTML='';msgEl.textContent='';
 if(!bytes||!bytes.length){msgEl.textContent='Nothing to show.';return}
 const t=bytes[0];
 if(t===TYPE_TEXT){
  const div=document.createElement('div');div.className='found-text';
  try{div.textContent=td.decode(bytes.slice(1))}catch{msgEl.textContent='Could not read as text.';return}
  outEl.appendChild(div);
 } else if(t===TYPE_IMG_RAW&&bytes.length>=3){
  const W=bytes[1],H=bytes[2],c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),im=x.createImageData(W,H);
  for(let i=0;i<W*H;i++){im.data[i*4]=bytes[3+i*3];im.data[i*4+1]=bytes[4+i*3];im.data[i*4+2]=bytes[5+i*3];im.data[i*4+3]=255}
  x.putImageData(im,0,0);
  const big=document.createElement('canvas');big.width=W*8;big.height=H*8;big.style.maxWidth='260px';const bx=big.getContext('2d');bx.imageSmoothingEnabled=false;bx.drawImage(c,0,0,big.width,big.height);
  outEl.appendChild(big);
  const btn=document.createElement('button');btn.className='secondary';btn.textContent='Save this picture';btn.onclick=()=>saveCanvas(big,'revealed.png',msgEl);outEl.appendChild(btn);
 } else if(t===TYPE_IMG_JPEG){
  try{
   const blob=new Blob([bytes.slice(1)],{type:'image/jpeg'});
   const im=await blobToImage(blob);
   const big=document.createElement('canvas');big.width=im.naturalWidth*4;big.height=im.naturalHeight*4;big.style.maxWidth='260px';const bx=big.getContext('2d');bx.imageSmoothingEnabled=false;bx.drawImage(im,0,0,big.width,big.height);
   outEl.appendChild(big);
   const btn=document.createElement('button');btn.className='secondary';btn.textContent='Save this picture';btn.onclick=()=>saveCanvas(big,'revealed.png',msgEl);outEl.appendChild(btn);
  }catch{msgEl.textContent='Found a compressed picture but could not decode it.'}
 } else if(t===TYPE_AUDIO){
  const blob=new Blob([bytes.slice(1)],{type:'audio/webm'});
  const a=document.createElement('audio');a.controls=true;a.style.width='100%';a.src=URL.createObjectURL(blob);
  outEl.appendChild(a);
  const btn=document.createElement('button');btn.className='secondary';btn.textContent='Save this audio clip';
  btn.onclick=async()=>{if(!dl){msgEl.textContent='Saving is not available in this view.';return}try{await dl.save({filename:'revealed-audio.webm',data:blob});msgEl.textContent=''}catch(e){msgEl.textContent=e.code==='declined'?'':'Could not save: '+(e.message||e.code)}};
  outEl.appendChild(btn);
 } else { msgEl.textContent='Unrecognized payload type.'; }
}
function saveCanvas(cv,name,msgEl){cv.toBlob(async blob=>{if(!dl){if(msgEl)msgEl.textContent='Saving is not available in this view.';return}try{await dl.save({filename:name,data:blob});if(msgEl)msgEl.textContent=''}catch(e){if(msgEl)msgEl.textContent=e.code==='declined'?'':'Could not save: '+(e.message||e.code)}},'image/png')}

function bytesToFrame(bytes){const len=bytes.length,head=new Uint8Array(4);head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;let sum=0;for(const b of bytes)sum=(sum+b)&255;const out=new Uint8Array(4+len+1);out.set(head,0);out.set(bytes,4);out[4+len]=sum;return out}

// ================= carrier tabs =================
const carrierDesc={
 text:'Hides inside ordinary-looking text — invisible characters, zero-width bits, or lookalike letters.',
 pic:'Hides in the last 2 bits of every pixel of a real picture — invisible to the eye. Save and share as PNG; JPEG or recompression destroys it.',
 snd:'Turns the payload into two-tone audio bursts. Upload a recording — or another device — to decode it.'
};
document.querySelectorAll('.row[aria-label="Carrier"] button').forEach(b=>b.onclick=()=>{

 $('sBar').style.width='0%';$('sBytes').textContent='';$('sPw2').style.display='none';
 $('sStatus').textContent='Listening…';$('sTones').textContent='';
 rxRunning=true;$('sListen').style.display='none';$('sStop').style.display='block';
 rxIntervalId=setInterval(rxLoopS,15);
}
function stopListeningS(){rxRunning=false;if(rxIntervalId)clearInterval(rxIntervalId);if(rxStream)rxStream.getTracks().forEach(t=>t.stop());if(rxCtx)rxCtx.close();
 $('sListen').style.display='block';$('sStop').style.display='none';if(!rxDone)$('sStatus').textContent='Stopped.'}
$('sListen').onclick=startListeningS;$('sStop').onclick=stopListeningS;
function rxLoopS(){
 if(!rxRunning)return;
 rxAnalyser.getFloatTimeDomainData(td8);const sr=rxCtx.sampleRate;
 const preE=goertzel(td8,0,td8.length,PRE[0],sr)+goertzel(td8,0,td8.length,PRE[1],sr);
 if(rxState==='idle'){if(preE>40){preambleStreak++;if(preambleStreak>4){rxState='inpreamble';$('sStatus').textContent='Preamble detected…'}}else preambleStreak=Math.max(0,preambleStreak-1)}
 else if(rxState==='inpreamble'){if(preE<15){tPreEnd=rxCtx.currentTime;nextSymbolTime=tPreEnd+0.05+0.72*T;rxState='receiving';$('sStatus').textContent='Receiving…'}}
 else if(rxState==='receiving'){
  if(rxCtx.currentTime>=nextSymbolTime){
   let bestLo=-1,bestLoE=-1,bestHi=-1,bestHiE=-1;
   for(let i=0;i<LOW.length;i++){const e=goertzel(td8,0,td8.length,LOW[i],sr);if(e>bestLoE){bestLoE=e;bestLo=i}}
   for(let i=0;i<HIGH.length;i++){const e=goertzel(td8,0,td8.length,HIGH[i],sr);if(e>bestHiE){bestHiE=e;bestHi=i}}
   $('sTones').textContent='hearing '+LOW[bestLo]+'Hz + '+HIGH[bestHi]+'Hz  (symbol '+(symbolsSeen+1)+')';
   const sym=(bestLo<<3)|bestHi;for(let k=5;k>=0;k--)rxBits.push((sym>>k)&1);symbolsSeen++;onNewBitsS();nextSymbolTime+=T;
  }
 }
}
async function onNewBitsS(){
 if(rxLen===null&&rxBits.length>=32){const b=bitsToBytesArr(rxBits,4);rxLen=(b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3];
  if(rxLen<0||rxLen>2000000){$('sMsg2').textContent='Signal looks corrupted. Try again, closer/louder.';rxState='idle';preambleStreak=0;rxLen=null;return}}
 if(rxLen!==null){
  const totalBits=(4+rxLen+1)*8;
  $('sBar').style.width=Math.min(100,100*rxBits.length/totalBits)+'%';
  $('sBytes').textContent=Math.floor(rxBits.length/8)+' / '+(4+rxLen+1)+' bytes';
  if(rxBits.length>=totalBits&&!rxDone){
   rxDone=true;
   const result=bitsToFrameBytes(rxBits);
   await sHandleDecoded(result,$('sStatus'),$('sMsg2'),$('found_snd'),$('sPw2'),v=>pendingLockedSndLive=v);
   rxState='idle';preambleStreak=0;
  }
 }
}
